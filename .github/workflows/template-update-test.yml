name: Template update

# Generates an instance from the most recent tag and applies the current state
# of the template to it with cruft, then builds the result. This catches
# changes that render cleanly but break existing instances on update.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install cruft
        run: pip install cruft

      - name: Find the most recent tag
        id: previous
        run: |
          TAG=$(git tag --sort=-v:refname | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "No tag yet - nothing to update from."
          fi

      - name: Generate from the previous tag
        if: steps.previous.outputs.tag != ''
        run: |
          cruft create --no-input --checkout "${{ steps.previous.outputs.tag }}" \
            --skip envs --skip .env --skip src/private --output-dir rendered "$GITHUB_WORKSPACE"
          INSTANCE=$(find rendered -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "INSTANCE=$INSTANCE" >> "$GITHUB_ENV"

      - name: Commit the generated state
        if: steps.previous.outputs.tag != ''
        working-directory: ${{ env.INSTANCE }}
        # cruft refuses an unclean working tree, and only a git repository
        # gets the three-way merge instead of reject files.
        run: |
          git init -q .
          git config user.email ci@example.invalid
          git config user.name CI
          git add -A
          git commit -qm "generated from ${{ steps.previous.outputs.tag }}"

      - name: Apply the current template
        if: steps.previous.outputs.tag != ''
        working-directory: ${{ env.INSTANCE }}
        run: |
          cruft update --skip-apply-ask --checkout "$GITHUB_SHA"
          if find . -name "*.rej" | grep -q .; then
            echo "The update produced reject files:" >&2
            find . -name "*.rej" -exec echo "  {}" \; >&2
            exit 1
          fi
          git diff --stat

      - name: The updated instance must still build and pass its tests
        if: steps.previous.outputs.tag != ''
        working-directory: ${{ env.INSTANCE }}
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
