services:
  ui:
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    build:
      context: .
      target: development
      dockerfile: ./Dockerfile
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
    networks:
      - ext-proxy-net
    expose:
      - 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{ cookiecutter.ifdd_ui_prj_slug }}.rule=Host(`${IFDD_UI_HOST}`)"
      - "traefik.http.services.{{ cookiecutter.ifdd_ui_prj_slug }}.loadbalancer.server.port=3000"
      - "traefik.docker.network={{ cookiecutter.ifdd_proxy_network }}"
    restart: always

networks:
  ext-proxy-net:
    name: {{ cookiecutter.ifdd_proxy_network }}
    external: true
