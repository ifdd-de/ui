name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The private tree is usually a submodule. Without it the build still
          # succeeds; the private tabs are simply absent.
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  template:
    name: Template drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install cruft
        run: pip install cruft

      - name: Is this instance behind its template?
        continue-on-error: true
        run: cruft check

      - name: How far has this instance drifted from its template?
        # Everything shown here is a backport candidate: it either belongs
        # upstream in the template, or the file belongs on the skip list.
        continue-on-error: true
        run: cruft diff
